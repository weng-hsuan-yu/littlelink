<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/brands.css">

    <title>Program</title>
</head>

<body>

    <div class="container">
        <div class="column">

            <!--
              By default, the Avatar is rounded. Use the following:
              - avatar--rounded: Automatically rounds the image
              - avatar--soft: Slightly rounds the image
              - avatar--none: Removes any rounding

              Be sure to replace the src with your own image path and update the alt text
            -->
            <img class="avatar avatar--rounded" src="images/Program.png" alt="">

            <!-- Replace with your name or brand -->
            <h1>
                <div>Program</div>
            </h1>

            <!-- Add a short description about yourself or your brand -->
            <p>Patience</p>

            <p>In Learning</p>

            <!-- All your buttons go here -->
            <div class="button-stack" role="navigation">

                <!-- C++ -->
                <a class="button button-github" href="images/dev-c.png" target="_blank" rel="noopener"
                    role="button"><img class="icon" aria-hidden="true" src="images/dev-c.png"
                        alt="GitHub Logo">C++</a>

                <!-- Python -->
                <a class="button button-github" href="images/Python.png" target="_blank" rel="noopener" role="button"><img
                        class="icon" aria-hidden="true" src="images/Python.png" >Python</a>
                
                <!-- C -->
                <a class="button button-github" href="images/C.png" target="_blank" rel="noopener" role="button"><img
                        class="icon" aria-hidden="true" src="images/C.png" >C</a>
                
                <!-- cmd -->
                <a class="button button-dev-to" href="images/cmd.png" target="_blank" rel="noopener" role="button"><img
                        class="icon" aria-hidden="true" src="images/cmd.png" >cmd</a>

                <!-- raspberry pi-->
                <a class="button button-github" href="images/raspberry pi.png" target="_blank" rel="noopener" role="button"><img
                        class="icon" aria-hidden="true" src="images/raspberry pi.png" >raspberry pi</a>

            </div>

            <p>Target</p>
            
            <div class="button-stack" role="navigation">

                <!-- VBN -->
                <a class="button button-github" href="" target="_blank" rel="noopener"
                    role="button"><img class="icon" aria-hidden="true" src="images/VBN.jpg"
                        alt="GitHub Logo">VBN</a>

                <!-- C# -->
                <a class="button button-github" href="" target="_blank" rel="noopener"
                    role="button"><img class="icon" aria-hidden="true" src="images/C#.png"
                        alt="GitHub Logo">C#</a>
                
                <!-- unity -->
                <a class="button button-github" href="" target="_blank" rel="noopener"
                    role="button"><img class="icon" aria-hidden="true" src="images/unity.png"
                        alt="GitHub Logo">unity</a>

            </div>

        </div>
    </div>

</body>

</html>
